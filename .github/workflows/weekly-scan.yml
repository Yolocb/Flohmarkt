name: Woechentlicher Termin-Scan

# Durchsucht die Lions-Club-Seiten einmal pro Woche nach neuen Terminen
# und committet die aktualisierte docs/data/flohmaerkte.json automatisch.
# Manuell gepruefte Eintraege (manuellGeprueft: true) bleiben erhalten,
# bekannte Fehltreffer (scripts/excluded_ids.json) werden ausgeblendet.

on:
  schedule:
    # Montags 05:17 UTC (= 06:17/07:17 deutscher Zeit). Krumme Minute,
    # um Last auf den Vereinsseiten und bei GitHub nicht zu buendeln.
    - cron: "17 5 * * 1"
  # Erlaubt manuelles Ausloesen ueber den "Actions"-Tab auf GitHub.
  workflow_dispatch:

# Dem Workflow das Schreiben ins Repo (Commit) erlauben.
permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v5

      - name: Python einrichten
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Abhaengigkeiten installieren
        run: pip install -r scripts/requirements.txt

      - name: Termin-Scan ausfuehren
        run: python scripts/extract_lions_flohmaerkte.py --verbose

      - name: Aenderungen committen (nur wenn vorhanden)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/data/flohmaerkte.json docs/data/kandidaten.json
          if git diff --staged --quiet; then
            echo "Keine Termin-Aenderungen - nichts zu committen."
          else
            git commit -m "Automatischer Termin-Scan ($(date -u +%Y-%m-%d))"
            git push
          fi
